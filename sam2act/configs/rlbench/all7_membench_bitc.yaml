# all7_membench_bitc.yaml: Stage 0 config for 7 MemoryBench tasks (with blocks_in_two_cabinets).
# all7_membench_bitc.yaml: Replaces inspect_and_pick with blocks_in_two_cabinets vs all7_membench.

# Tasks (7 MemoryBench)
tasks: put_block_back,reopen_drawer,rearrange_block,stack_and_swap,blocks_in_drawers,blocks_in_drawers_hard,blocks_in_two_cabinets
exp_name: 7mem_bitc

# Training hyperparameters
bs: 32                   # per-GPU batch size (total BS = 64 with 2 GPUs)
epochs: 110              # tuned to fit a 15h30m node budget (~14.5h projected)
base_lr: 1.25e-5         # effective LR = 8e-4
steps_per_epoch: 625
warmup_steps: 2000

# Model config
use_memory: false
num_maskmem: 9

# Data
demo: 100
sample_distribution_mode: task_uniform

# Scripts
train_script: train.py
exp_cfg: configs/sam2act.yaml
mvt_cfg: mvt/configs/sam2act_step_emb.yaml

# Seed
seed: 42
