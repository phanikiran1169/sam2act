# all23.yaml: Stage 0 config for 23 tasks (18 RLBench + 5 MemoryBench incl blocks_in_drawers).
# all23.yaml: Adds blocks_in_drawers (D4 action-memory task) on top of all22.

# Tasks
tasks: put_item_in_drawer,reach_and_drag,turn_tap,slide_block_to_color_target,open_drawer,put_groceries_in_cupboard,place_shape_in_shape_sorter,put_money_in_safe,push_buttons,close_jar,stack_blocks,place_cups,place_wine_at_rack_location,light_bulb_in,sweep_to_dustpan_of_size,insert_onto_square_peg,meat_off_grill,stack_cups,put_block_back,reopen_drawer,rearrange_block,stack_and_swap,blocks_in_drawers
exp_name: 23tasks

# Training hyperparameters (paper Table 5)
bs: 32                   # per-GPU batch size (total BS = 64 with 2 GPUs)
epochs: 115              # scaled from 90 × 23/18 ≈ 115
base_lr: 1.25e-5         # LR scaling rule: effective_lr = base_lr × bs × gpus
steps_per_epoch: 625
warmup_steps: 2000

# Model config
use_memory: false
num_maskmem: 9

# Data
# exp_cfg.demo is global — all tasks use 100 demos (matches every other task's replay_meta).
demo: 100
sample_distribution_mode: task_uniform

# Scripts
train_script: train.py
exp_cfg: configs/sam2act.yaml
mvt_cfg: mvt/configs/sam2act_step_emb.yaml

# Seed (for reproducibility)
seed: 42
