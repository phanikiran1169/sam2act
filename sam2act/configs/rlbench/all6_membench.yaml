# all6_membench.yaml: Stage 0 config for 6 MemoryBench tasks only (no RLBench tasks).
# all6_membench.yaml: Adds blocks_in_drawers_hard (3-block variant) to the 5-task set used in #45.

# Tasks (6 MemoryBench)
tasks: put_block_back,reopen_drawer,rearrange_block,stack_and_swap,blocks_in_drawers,blocks_in_drawers_hard
exp_name: 6mem

# Training hyperparameters
bs: 32                   # per-GPU batch size (total BS = 64 with 2 GPUs)
epochs: 110
base_lr: 1.25e-5         # effective LR = 8e-4
steps_per_epoch: 625
warmup_steps: 2000

# Model config
use_memory: false
num_maskmem: 9

# Data
demo: 100
sample_distribution_mode: task_uniform

# Scripts
train_script: train.py
exp_cfg: configs/sam2act.yaml
mvt_cfg: mvt/configs/sam2act_step_emb.yaml

# Seed
seed: 42
