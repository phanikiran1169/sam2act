# sas_only.yaml: Stage 0 config for stack_and_swap only (1 task).
# sas_only.yaml: Isolates sas to test if it can learn without multi-task interference.

# Tasks
tasks: stack_and_swap
exp_name: sas_only

# Training hyperparameters
bs: 32                   # per-GPU batch size (total BS = 64 with 2 GPUs)
epochs: 90
base_lr: 1.25e-5         # LR scaling rule: effective_lr = base_lr × bs × gpus
steps_per_epoch: 625
warmup_steps: 2000

# Model config
use_memory: false
num_maskmem: 9

# Data
sample_distribution_mode: task_uniform

# Scripts
train_script: train.py
exp_cfg: configs/sam2act.yaml
mvt_cfg: mvt/configs/sam2act.yaml

# Seed (for reproducibility)
seed: 42
