# blocks_in_drawers_hard_stage1.yaml: MemoryBench Stage 1 config for blocks_in_drawers_hard.
# blocks_in_drawers_hard_stage1.yaml: Hyperparameters mirror Stage 0 (#54) — bs=32/GPU, base_lr=1.25e-5.

# Task
task: blocks_in_drawers_hard
stage: 1

# Training hyperparameters (matches #54 Stage 0)
bs: 32                   # per-GPU batch size (total BS = 64 with 2 GPUs)
epochs: 10
base_lr: 1.25e-5         # LR scaling rule: effective_lr = base_lr × bs × gpus
steps_per_epoch: 625
warmup_steps: 2000

# Model config
use_memory: false
num_maskmem: 9

# Data
sample_distribution_mode: task_uniform

# Scripts
train_script: train.py
exp_cfg: configs/sam2act.yaml
mvt_cfg: mvt/configs/sam2act_step_emb.yaml

# Seed (for reproducibility)
seed: 42
