# reopen_drawer_stage2.yaml: MemoryBench Stage 2 config for reopen_drawer.
# reopen_drawer_stage2.yaml: Step embedding ON, frozen during Stage 2.

# Task
task: reopen_drawer
stage: 2

# Training hyperparameters
bs: 10                   # per-GPU batch size (paper: 8)
epochs: 20
base_lr: 1.25e-5         # LR scaling rule: effective_lr = base_lr × bs × gpus
steps_per_epoch: 625
warmup_steps: 2000

# Model config
use_memory: true
num_maskmem: 9           # memory window N = num_maskmem + 1 = 10 (paper: 7)

# Data
sample_distribution_mode: demo_uniform_temporal

# Scripts
train_script: train_plus.py
exp_cfg: configs/sam2act_plus.yaml
mvt_cfg: mvt/configs/sam2act_plus_step_emb.yaml

# Seed (for reproducibility)
seed: 42
