# rearrange_block_stage2.yaml: MemoryBench Stage 2 config for rearrange_block.
# rearrange_block_stage2.yaml: Source — paper Table 6 "SAM2Act+ Training" column.

# Task
task: rearrange_block
stage: 2

# Training hyperparameters (paper Table 6)
bs: 32                   # per-GPU batch size (total BS = 64 with 2 GPUs)
epochs: 20
base_lr: 1.25e-5         # LR scaling rule: effective_lr = base_lr × bs × gpus
steps_per_epoch: 625
warmup_steps: 2000

# Model config
use_memory: true
num_maskmem: 9           # memory window N = num_maskmem + 1 = 10

# Data
sample_distribution_mode: demo_uniform_temporal

# Scripts
train_script: train_plus.py
exp_cfg: configs/sam2act_plus.yaml
mvt_cfg: mvt/configs/sam2act_plus_step_emb.yaml

# Seed (for reproducibility)
seed: 42
